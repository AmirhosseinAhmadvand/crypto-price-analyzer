<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto God Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Glassmorphism Base Styles */
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-5xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-500">
                Crypto God Dashboard
            </h1>
            <p class="text-gray-400">Real-time Analysis & AI Predictions</p>
        </header>

        <!-- Control Panel -->
        <div class="glass-card rounded-2xl p-6 mb-8 flex justify-center gap-4">
            <input type="text" id="coinInput" value="bitcoin" placeholder="Enter coin (e.g., ethereum)" 
                   class="bg-black/30 text-white px-4 py-2 rounded-lg border border-white/20 focus:outline-none focus:border-cyan-400 w-64">
            <button onclick="fetchData()" 
                    class="bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-600 hover:to-blue-600 text-white font-bold py-2 px-6 rounded-lg transition transform hover:scale-105">
                Analyze
            </button>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Price Card -->
            <div class="glass-card rounded-2xl p-6 text-center">
                <h3 class="text-gray-400 text-sm uppercase tracking-wider mb-2">Current Price</h3>
                <p id="priceDisplay" class="text-4xl font-bold text-cyan-400">Loading...</p>
            </div>
            
            <!-- Signal Card (English) -->
            <div class="glass-card rounded-2xl p-6 text-center">
                <h3 class="text-gray-400 text-sm uppercase tracking-wider mb-2">Signal (EN)</h3>
                <p id="signalEn" class="text-2xl font-bold text-white">--</p>
            </div>

            <!-- Signal Card (Persian) -->
            <div class="glass-card rounded-2xl p-6 text-center" dir="rtl">
                <h3 class="text-gray-400 text-sm uppercase tracking-wider mb-2">سیگنال (فارسی)</h3>
                <p id="signalFa" class="text-2xl font-bold text-white">--</p>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="glass-card rounded-2xl p-6">
            <h3 class="text-xl font-bold mb-4 text-gray-300">30-Day Price Trend</h3>
            <div class="relative h-96 w-full">
                <canvas id="priceChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let myChart = null;

        async function fetchData() {
            const coin = document.getElementById('coinInput').value || 'bitcoin';
            const priceDisplay = document.getElementById('priceDisplay');
            const signalEn = document.getElementById('signalEn');
            const signalFa = document.getElementById('signalFa');

            // Loading state
            priceDisplay.innerText = "Fetching...";
            
            try {
                const response = await fetch(`/api/data/${coin}`);
                const data = await response.json();

                if (data.status === 'success') {
                    // Update Text
                    priceDisplay.innerText = `$${data.current_price.toLocaleString()}`;
                    signalEn.innerText = data.recommendation_en;
                    signalFa.innerText = data.recommendation_fa;

                    // Color coding based on signal
                    if (data.signal === 'BUY') {
                        signalEn.className = "text-2xl font-bold text-green-400";
                        signalFa.className = "text-2xl font-bold text-green-400";
                    } else if (data.signal === 'SELL') {
                        signalEn.className = "text-2xl font-bold text-red-400";
                        signalFa.className = "text-2xl font-bold text-red-400";
                    } else {
                        signalEn.className = "text-2xl font-bold text-yellow-400";
                        signalFa.className = "text-2xl font-bold text-yellow-400";
                    }

                    // Update Chart
                    updateChart(data.chart_data);
                }
            } catch (error) {
                console.error("Error fetching data:", error);
                priceDisplay.innerText = "Error";
            }
        }

        function updateChart(chartData) {
            const ctx = document.getElementById('priceChart').getContext('2d');
            
            // Destroy old chart if exists
            if (myChart) myChart.destroy();

            // Create gradient
            let gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(0, 255, 255, 0.5)');
            gradient.addColorStop(1, 'rgba(0, 255, 255, 0)');

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.map(d => d.x),
                    datasets: [{
                        label: 'Price (USD)',
                        data: chartData.map(d => d.y),
                        borderColor: '#00ffff',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4 // Smooth curves
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: 'white' } }
                    },
                    scales: {
                        x: { ticks: { color: 'gray' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        y: { ticks: { color: 'gray' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }

        // Load Bitcoin data on start
        window.onload = fetchData;
    </script>
</body>
</html>
